<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Email</title>
  <style>
    /* Reset */
    body,
    table,
    td,
    p {
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      font-family: Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    img {
      border: 0;
      display: block;
    }

    a {
      text-decoration: none;
    }

    /* Container */
    .email-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 24px 16px 16px;
    }

    .logo {
      color: #e91e63;
      font-size: 22px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
    }

    .logo img {
      width: 150px;
      height: 150px;
      margin-right: 6px;
    }

    /* Hero Banner */
    .hero {
      text-align: center;
      margin: 0 16px;
      padding: 20px 16px;
    }

    .hero-title {
      padding: 20px 16px;
      background: linear-gradient(135deg, #673ab7 0%, #e91e63 100%);
      color: #fff;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
    }

    /* Content */
    .content {
      padding: 24px 16px;
      text-align: left;
    }

    .greeting {
      font-size: 15px;
      margin-bottom: 4px;
    }

    .email-address {
      font-size: 15px;
      font-weight: 600;
      text-decoration: underline;
      margin-bottom: 24px;
    }

    .otp-label {
      font-size: 15px;
      margin-bottom: 12px;
    }

    .otp-code {
      font-size: 40px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      color: #622774;
      background: linear-gradient(135deg, #673ab7 0%, #e91e63 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .otp-note {
      font-size: 13px;
      color: #444;
      text-align: center;
      line-height: 1.4;
    }

    /* Button */
    .cta {
      text-align: center;
      padding: 24px 16px 40px;
    }

    .cta a {
      display: block;
      background: linear-gradient(135deg, #673ab7 0%, #e91e63 100%);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 20px;
      border-radius: 6px;
    }

    /* Responsive */
    @media screen and (max-width: 480px) {
      .otp-code {
        font-size: 32px !important;
      }

      .hero-title {
        font-size: 16px !important;
      }
    }
  </style>
</head>
